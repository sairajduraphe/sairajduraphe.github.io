<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Illustration of a failure report being diagnosed by an AI assistant and then approved by a person">
<rect width="960" height="640" fill="#FFD84D"/>
<circle cx="860" cy="560" r="190" fill="#fff" opacity=".35"/><circle cx="70" cy="70" r="110" fill="#3046FF" opacity=".16"/>
<g>
<rect x="46" y="150" width="262" height="300" rx="22" fill="#fff"/>
<circle cx="80" cy="190" r="12" fill="#FF6B3D"/><text x="102" y="196" font-size="18" font-weight="700" fill="#0A1330">Failure reported</text>
<rect x="76" y="226" width="200" height="12" rx="6" fill="#E1E4F5"/><rect x="76" y="254" width="170" height="12" rx="6" fill="#E1E4F5"/><rect x="76" y="282" width="190" height="12" rx="6" fill="#E1E4F5"/>
<rect x="76" y="330" width="130" height="34" rx="17" fill="#FFE6DC"/><text x="94" y="352" font-size="14" font-weight="600" fill="#B3411B">Upload failed</text>
<text x="76" y="414" font-size="13" fill="#5B6785">Checked every 5 minutes</text></g>
<g>
<rect x="349" y="110" width="262" height="380" rx="22" fill="#3046FF"/>
<circle cx="383" cy="152" r="12" fill="#3EE0B0"/><text x="405" y="158" font-size="18" font-weight="700" fill="#fff">AI diagnosis</text>
<rect x="379" y="190" width="202" height="12" rx="6" fill="#fff" opacity=".85"/><rect x="379" y="218" width="160" height="12" rx="6" fill="#fff" opacity=".6"/><rect x="379" y="246" width="190" height="12" rx="6" fill="#fff" opacity=".6"/><rect x="379" y="274" width="120" height="12" rx="6" fill="#fff" opacity=".6"/>
<rect x="379" y="322" width="202" height="62" rx="14" fill="#fff" opacity=".16"/><text x="395" y="348" font-size="14" font-weight="600" fill="#fff">Likely cause found</text><text x="395" y="370" font-size="13" fill="#CFCBFF">Fix proposed, not applied</text></g>
<g>
<rect x="652" y="150" width="262" height="300" rx="22" fill="#fff"/>
<circle cx="686" cy="190" r="12" fill="#3EE0B0"/><text x="708" y="196" font-size="18" font-weight="700" fill="#0A1330">You decide</text>
<rect x="682" y="226" width="200" height="12" rx="6" fill="#E1E4F5"/><rect x="682" y="254" width="150" height="12" rx="6" fill="#E1E4F5"/>
<rect x="682" y="310" width="96" height="44" rx="22" fill="#3046FF"/><text x="730" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Approve</text>
<rect x="790" y="310" width="82" height="44" rx="22" fill="#fff" stroke="#0A1330" stroke-width="2"/><text x="831" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#0A1330">Hold</text>
<text x="682" y="414" font-size="13" fill="#5B6785">Nothing changes without a yes</text></g>
<g stroke="#0A1330" stroke-width="4" stroke-linecap="round" fill="none"><path d="M312 300H342"/><path d="M334 290l12 10-12 10"/><path d="M616 300H646"/><path d="M638 290l12 10-12 10"/></g>
<rect x="330" y="540" width="300" height="42" rx="21" fill="#0A1330"/><text x="480" y="567" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Posts to one private channel only</text>
</svg>
